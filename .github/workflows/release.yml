name: Windows package and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'WQMYH/multi-compat-cc' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_PM_ON_FAIL: error
      PNPM_CONFIG_RUNTIME_ON_FAIL: error
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm revision and version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release revision is not on main.' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($package.version -ne $config.version -or $cargo -notmatch ('(?m)^version = "' + [regex]::Escape($config.version) + '"\r?$')) {
            throw 'Package, Tauri and Cargo versions must match.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $config.version)) {
            throw 'Release tag must exactly match the application version.'
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc

      - name: Record build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node --version) -ne 'v24.22.1' -or (pnpm --version) -ne '10.12.3') {
            throw 'Unexpected Node or pnpm version.'
          }
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          node --version
          pnpm --version
          rustc --version --verbose
          cargo --version --verbose
          Get-FileHash pnpm-lock.yaml, src-tauri/Cargo.lock -Algorithm SHA256 | Format-Table Path, Hash
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $vs) { throw 'Visual Studio C++ build tools are unavailable.' }
          Write-Host "Visual Studio: $($vs.displayName) $($vs.installationVersion)"
          $vcVersion = Join-Path $vs.installationPath 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt'
          Write-Host "Default MSVC tools: $((Get-Content $vcVersion -Raw).Trim())"
          $kits = (Get-ItemProperty 'HKLM:/SOFTWARE/Microsoft/Windows Kits/Installed Roots').KitsRoot10
          $sdks = @(Get-ChildItem -LiteralPath (Join-Path $kits 'Lib') -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host "Installed Windows SDKs: $($sdks -join ', ')"

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm run typecheck

      - name: Test relevant frontend behavior
        run: pnpm exec vitest run tests/components/ProviderCard.copilotAccount.test.tsx tests/components/AboutSection.update.test.tsx tests/components/DatabaseUpgrade.test.tsx tests/integration/wix-update-policy.test.ts tests/components/DshAddProviderDialog.test.tsx tests/components/DshAccountCard.test.tsx tests/hooks/useAddProviderMutation.test.tsx tests/config/appSpecs.test.ts src/config/codexProviderPresets.test.ts tests/components/CodexFormFields.modelFetch.test.tsx

      - name: Test usage, storage and updater behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-TestGroup([string]$filter) {
            $listed = @(cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --release --locked --lib --jobs 4 $filter -- --list)
            if ($LASTEXITCODE -ne 0 -or -not ($listed -match ': test$')) { throw "Rust test group was not discovered: $filter" }
            cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --release --locked --lib --jobs 4 $filter -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Rust test group failed: $filter" }
          }
          foreach ($filter in @('guardian_', 'data_paths::tests', 'data_migration::tests', 'auto_launch::tests', 'app_update::tests', 'provider_kind::tests', 'app_specs_match_shared_fixture', 'backups_recover_after_poisoned_file_operation', 'route_mode_apps_keep_desktop_last', 'commands::settings::tests', 'commands::misc::tests', 'vision_capability_', 'copilot_catalog_uses_declared_vision_capabilities_and_infers_unknowns', 'codex_catalog_modalities_control_image_rectification')) {
            Invoke-TestGroup $filter
          }
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'ccswitch-test-dsh'
          $env:CC_SWITCH_TEST_HOME = Join-Path $env:RUNNER_TEMP 'ccswitch-test-home'
          foreach ($filter in @('dsh_config::tests', 'dsh_oauth_workflow_tests')) {
            Invoke-TestGroup $filter
          }

      # Build the frontend before injecting any signing secret.
      - name: Build frontend
        run: pnpm run build:renderer

      - name: Build and sign MSI
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Repository updater signing secrets are required.'
          }
          $config = Join-Path $env:RUNNER_TEMP 'ccswitch-tauri-ci.json'
          [IO.File]::WriteAllText($config, '{"build":{"beforeBuildCommand":"echo frontend-prebuilt"}}', [Text.UTF8Encoding]::new($false))
          pnpm exec tauri build --ci --config $config --target x86_64-pc-windows-msvc --bundles msi -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed.' }

      - name: Record Windows packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'WiX source: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          Write-Host 'WiX archive SHA256 expected by Tauri CLI 2.12.4: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          $wix = Join-Path $env:LOCALAPPDATA 'tauri/WixTools314'
          foreach ($name in @('candle.exe', 'light.exe')) {
            $path = Join-Path $wix $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing WiX tool: $name" }
            Write-Host "$name version $([Diagnostics.FileVersionInfo]::GetVersionInfo($path).FileVersion); SHA256 $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          }
          Write-Host 'WebView2 is downloaded from Microsoft at installation only if the runtime is missing: https://go.microsoft.com/fwlink/p/?LinkId=2124703'

      - name: Verify signature and reject altered packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $msis = @(Get-ChildItem -LiteralPath "$root/bundle/msi" -Filter '*.msi' -File)
          if ($msis.Count -ne 1) { throw 'Expected exactly one MSI.' }
          $signature = $msis[0].FullName + '.sig'
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) { throw 'MSI signature is missing.' }
          $publicBox = Join-Path $env:RUNNER_TEMP 'ccswitch-public-key.txt'
          $signatureBox = Join-Path $env:RUNNER_TEMP 'ccswitch-signature.txt'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $public = $config.plugins.updater.pubkey
          [IO.File]::WriteAllBytes($publicBox, [Convert]::FromBase64String($public))
          [IO.File]::WriteAllBytes($signatureBox, [Convert]::FromBase64String([IO.File]::ReadAllText($signature).Trim()))
          $deps = Join-Path (Resolve-Path $root) 'deps'
          $libs = @(Get-ChildItem -LiteralPath $deps -Filter 'libminisign_verify-*.rlib' -File | Sort-Object LastWriteTime -Descending)
          if ($libs.Count -eq 0) { throw 'Tauri verifier dependency is missing.' }
          $verifier = Join-Path $env:RUNNER_TEMP 'ccswitch-verify-update.exe'
          rustc --edition 2021 --target x86_64-pc-windows-msvc -C lto=thin --extern "minisign_verify=$($libs[0].FullName)" -L "dependency=$deps" .github/scripts/verify-updater-signature.rs -o $verifier
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build updater signature verifier.' }
          & $verifier $publicBox $signatureBox $msis[0].FullName $config.version
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification failed.' }

      - name: Assemble update and portable artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $root = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $msis = @(Get-ChildItem -LiteralPath "$root/bundle/msi" -Filter '*.msi' -File)
          if ($msis.Count -ne 1) { throw 'Expected exactly one MSI.' }
          $sig = $msis[0].FullName + '.sig'
          if (-not (Test-Path -LiteralPath $sig -PathType Leaf)) { throw 'MSI updater signature is missing.' }
          $assets = Join-Path $env:RUNNER_TEMP 'ccswitch-release-assets'
          $portable = Join-Path $env:RUNNER_TEMP 'ccswitch-portable'
          New-Item -ItemType Directory -Path $assets, $portable | Out-Null
          $msiName = "CC-Switch-v$version-Windows.msi"
          $zipName = "CC-Switch-v$version-Windows-Portable.zip"
          Copy-Item -LiteralPath $msis[0].FullName -Destination (Join-Path $assets $msiName)
          Copy-Item -LiteralPath $sig -Destination (Join-Path $assets ($msiName + '.sig'))
          Copy-Item -LiteralPath "$root/cc-switch.exe" -Destination (Join-Path $portable 'cc-switch.exe')
          [IO.File]::WriteAllText((Join-Path $portable 'portable.ini'), '', [Text.UTF8Encoding]::new($false))
          Compress-Archive -Path "$portable/*" -DestinationPath (Join-Path $assets $zipName)
          $manifest = @{
            version = $version
            notes = 'CC Switch personal release'
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = [IO.File]::ReadAllText($sig).Trim()
                url = "https://github.com/WQMYH/multi-compat-cc/releases/download/v$version/$msiName"
              }
            }
          }
          [IO.File]::WriteAllText((Join-Path $assets 'latest.json'), ($manifest | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          $checksums = @(Get-ChildItem -LiteralPath $assets -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          })
          [IO.File]::WriteAllLines((Join-Path $assets 'SHA256SUMS.txt'), $checksums, [Text.UTF8Encoding]::new($false))

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cc-switch-windows-${{ github.sha }}
          path: ${{ runner.temp }}/ccswitch-release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'WQMYH/multi-compat-cc' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cc-switch-windows-${{ github.sha }}
          path: release-assets

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: WQMYH/multi-compat-cc
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/latest.json
          test -f release-assets/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GH_REPO" --verify-tag \
            --title "CC Switch $RELEASE_TAG" \
            --notes "Windows x64 build from the personal main branch."
